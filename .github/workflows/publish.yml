# Publish to npm via OIDC Trusted Publishing.
#
# Triggered by a git tag matching v*.*.* (semver, including pre-release like
# v1.0.0-rc.1). The runner authenticates to npm via GitHub's OIDC token, so
# no NPM_TOKEN secret is required — the package's trusted publisher entry on
# npmjs.com gates which workflow file in which repo can publish.
#
# Pre-requisites (one-time setup on npmjs.com):
#   1. npm package settings -> Access -> Trusted Publishers -> Add
#   2. Org:           smurfy92
#      Repo:          openclaw-control-mcp
#      Workflow file: publish.yml
#      Environment:   (leave blank)
#
# Local release workflow becomes:
#   - bump version + CHANGELOG, commit, push
#   - git tag v0.7.0 && git push --tags
#   - workflow runs, publishes with provenance attestation
#   - no OTP prompt, no token to rotate
#
# After a successful npm publish, the same job publishes server.json to the
# official MCP Registry (io.github.smurfy92/openclaw-control-mcp) with
# `mcp-publisher login github-oidc`: the registry exchanges the GitHub OIDC
# token (id-token: write, already granted below) and grants publish rights on
# io.github.<repository_owner>/*. No secret involved. The registry checks that
# the npm package exists and that its package.json `mcpName` equals the
# server.json `name`, hence the ordering. See CONTRIBUTING.md > Release.

name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 22 ships npm 10.x,
      # which silently falls back to the placeholder NODE_AUTH_TOKEN and gets a 404
      # on PUT (v0.7.0 on 2026-06-09 and v0.8.0 on 2026-09-10 both failed this way).
      # Épinglé sur la version qui a publié 0.8.0 (run 34477462252). Monter volontairement.
      - run: npm install -g npm@12.0.2 && npm --version

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify version match
        shell: bash
        run: |
          PKG=$(jq -r .version package.json)
          # GITHUB_REF is a native env var injected by Actions (e.g. refs/tags/v0.7.0).
          # Strip the refs/tags/v prefix to compare with package.json.
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "version mismatch: tag=$TAG, package.json=$PKG" >&2
            exit 1
          fi
          echo "version match: $PKG"

      - name: Verify server.json matches package.json
        shell: bash
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          PKG_NAME=$(jq -r .name package.json)
          MCP_NAME=$(jq -r .mcpName package.json)
          SRV_NAME=$(jq -r .name server.json)
          SRV_VERSION=$(jq -r .version server.json)
          SRV_PKG_ID=$(jq -r '.packages[0].identifier' server.json)
          SRV_PKG_VERSION=$(jq -r '.packages[0].version' server.json)
          fail=0
          [ "$MCP_NAME" = "$SRV_NAME" ] || { echo "package.json mcpName=$MCP_NAME != server.json name=$SRV_NAME" >&2; fail=1; }
          [ "$SRV_VERSION" = "$PKG_VERSION" ] || { echo "server.json version=$SRV_VERSION != package.json version=$PKG_VERSION" >&2; fail=1; }
          [ "$SRV_PKG_VERSION" = "$PKG_VERSION" ] || { echo "server.json packages[0].version=$SRV_PKG_VERSION != package.json version=$PKG_VERSION" >&2; fail=1; }
          [ "$SRV_PKG_ID" = "$PKG_NAME" ] || { echo "server.json packages[0].identifier=$SRV_PKG_ID != package.json name=$PKG_NAME" >&2; fail=1; }
          exit $fail

      # mcp-publisher (official MCP Registry CLI), pinned by version AND by the
      # sha256 published in registry_<version>_checksums.txt of the GitHub
      # release. Bump both together, on purpose: the registry rejects binaries
      # that are too old ("invalid audience"), so a login failure after a
      # registry deployment usually means "bump this pin".
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${ARCHIVE}"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version

      # Read-only check against the registry's /v0/validate endpoint, before
      # anything is published anywhere.
      - name: Validate server.json against the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'

      - name: Publish to npm
        id: npm-publish
        run: npm publish --provenance --access public

      # Only runs when npm publish succeeded: the registry verifies that the npm
      # package version exists and that its mcpName matches server.json.
      - name: Authenticate to MCP Registry (GitHub OIDC)
        if: ${{ success() && steps.npm-publish.outcome == 'success' }}
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      # Retries cover the short window where the freshly published npm version
      # is not yet visible to the registry's package validation.
      - name: Publish to MCP Registry
        if: ${{ success() && steps.npm-publish.outcome == 'success' }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/mcp-publisher" publish server.json; then
              exit 0
            fi
            echo "mcp-publisher publish failed (attempt $attempt/3), retrying in 30s" >&2
            sleep 30
          done
          exit 1
